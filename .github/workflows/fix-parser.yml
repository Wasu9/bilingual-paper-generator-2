name: Fix parser
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch question block parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''            if n2==last:continue\n            if n2==last+1:run.append((p2,n2));last=n2;continue\n            if n2<=last:continue\n            break'''
          new='''            if n2==last+1:\n                run.append((p2,n2));last=n2;continue\n            break'''
          if old not in s:
              raise SystemExit(0)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Fix preamble numbering mixed into questions'
          git push
