name: PaperCraft AI QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx PyMuPDF

      - name: Compile critical Python modules
        run: python -m py_compile app.py final_qa.py sitecustomize.py tests/regression_suite.py tests/final_qa_suite.py

      - name: Run parser regression suite
        run: python tests/regression_suite.py

      - name: Run final QA regression suite
        run: python tests/final_qa_suite.py
