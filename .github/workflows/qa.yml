name: PaperCraft AI QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx PyMuPDF reportlab requests deep-translator streamlit

      - name: Compile critical Python modules
        run: python -m py_compile app.py final_qa.py sitecustomize.py tests/regression_suite.py tests/final_qa_suite.py tests/generate_pdf_fixtures.py tests/docx_e2e_suite.py

      - name: Generate PDF regression fixtures
        run: python tests/generate_pdf_fixtures.py tests/fixtures

      - name: Run parser regression suite
        run: python tests/regression_suite.py tests/fixtures/parser_12q.pdf tests/fixtures/parser_155q_malformed154.pdf

      - name: Run final QA regression suite
        run: PYTHONPATH=. python tests/final_qa_suite.py

      - name: Run DOCX end-to-end regression suite
        run: PYTHONPATH=. python tests/docx_e2e_suite.py
