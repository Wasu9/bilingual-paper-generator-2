name: Phase 3 tolerance refinement

on:
  push:
    paths:
      - 'tools/phase3_tolerance_patch.py'
      - '.github/workflows/phase3_tolerance_apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-tolerance-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tolerance refinement
        run: python tools/phase3_tolerance_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit and cleanup
        run: |
          rm -f tools/phase3_tolerance_patch.py .github/workflows/phase3_tolerance_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tools/phase3_tolerance_patch.py .github/workflows/phase3_tolerance_apply.yml
          git commit -m '[phase3-tolerance-bot] Refine visual option matching'
          git push
