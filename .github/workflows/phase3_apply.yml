name: Phase 3 visual pipeline

on:
  push:
    paths:
      - 'tools/phase3_patch.py'
      - '.github/workflows/phase3_apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Phase 3 patch
        run: python tools/phase3_patch.py
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Validate visual helper logic
        run: |
          python - <<'PY'
          import io
          import fitz
          import app
          doc=fitz.open()
          page=doc.new_page(width=600,height=800)
          page.insert_text((50,100),'1. Visual test')
          page.insert_text((50,180),'(1)')
          page.insert_text((200,180),'(2)')
          page.insert_text((350,180),'(3)')
          page.insert_text((500,180),'(4)')
          img=fitz.Pixmap(fitz.csRGB,fitz.IRect(50,110,590,175),False)
          img.clear_with(255)
          page.insert_image(fitz.Rect(50,110,590,175),pixmap=img)
          data=doc.tobytes()
          assets=app.figure_assets(data)
          assert isinstance(assets,dict)
          print('PASS Phase 3 visual pipeline import/test')
          PY
      - name: Commit implementation and remove patch tooling
        run: |
          rm -f tools/phase3_patch.py .github/workflows/phase3_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tools/phase3_patch.py .github/workflows/phase3_apply.yml
          git commit -m '[phase3-bot] Implement Phase 3 visual pipeline'
          git push
