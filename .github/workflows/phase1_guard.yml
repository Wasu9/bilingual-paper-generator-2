name: Phase 1 Guard
on:
  push:
    paths:
      - '.github/workflows/phase1_guard.yml'
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add extraction guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          old='''def validate_records(rs):
    nums=[q['num'] for q in rs]
    issues=[]
    if not nums: return ['No numbered questions detected.']
    if nums[0] != 1: issues.append(f'Question sequence starts at {nums[0]}, not 1.')
    expected=list(range(1,max(nums)+1))
    missing=[n for n in expected if n not in nums]
    duplicates=sorted({n for n in nums if nums.count(n)>1})
    if missing: issues.append('Missing question number(s): '+', '.join(map(str,missing[:20])))
    if duplicates: issues.append('Duplicate question number(s): '+', '.join(map(str,duplicates[:20])))
    if nums != sorted(nums): issues.append('Question numbers are out of order.')
    return issues
'''
          new='''def validate_records(rs,ps=None):
    nums=[q['num'] for q in rs]
    issues=[]
    if not nums: return ['No numbered questions detected.']
    if nums[0] != 1: issues.append(f'Question sequence starts at {nums[0]}, not 1.')
    expected=list(range(1,max(nums)+1))
    missing=[n for n in expected if n not in nums]
    duplicates=sorted({n for n in nums if nums.count(n)>1})
    if missing: issues.append('Missing question number(s): '+', '.join(map(str,missing[:20])))
    if duplicates: issues.append('Duplicate question number(s): '+', '.join(map(str,duplicates[:20])))
    if nums != sorted(nums): issues.append('Question numbers are out of order.')
    if ps:
        candidate_nums=[n for _,n in _question_candidates('\\n'.join(ps))]
        candidate_max=max(candidate_nums,default=0)
        if candidate_max > max(nums):
            issues.append(f'Question extraction stopped at {max(nums)}, but question-number candidates continue through {candidate_max}.')
    return issues
'''
          if old not in s: raise SystemExit('validate_records anchor not found')
          s=s.replace(old,new,1)
          if 'structure_issues=validate_records(rs)' not in s: raise SystemExit('UI guard anchor not found')
          s=s.replace('structure_issues=validate_records(rs)','structure_issues=validate_records(rs,data)',1)
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Add extraction completeness guard'
          git push
