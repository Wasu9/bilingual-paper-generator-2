name: Phase 1 Apply
on:
  push:
    paths:
      - '.github/workflows/phase1_apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply parser repair
        run: python tools/phase1_patch.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Boundary regression test
        run: |
          python - <<'PY'
          import app
          def check(expected):
              pages=[]
              pages.append('''1. Use of Electronic / Manual Calculator is prohibited.\n2. Candidates are governed by all Rules and Regulations.\nVERSION-01 I-PUC NEET Page 1 of 16\n1. What is the first question?\n(1) A\n(2) B\n(3) C\n(4) D\n2. Which is correct?\n(1) A\n(2) B\n(3) C\n(4) D\n3. What is given?\n(1) A\n(2) B\n(3) C\n(4) D\n4. Which is correct?\n(1) A\n(2) B\n(3) C\n(4) D\n5. Find the value.\n(1) A\n(2) B\n(3) C\n(4) D\n6. Determine the answer.\n(1) A\n(2) B\n(3) C\n(4) D\n7. Choose the correct option.\n(1) A\n(2) B\n(3) C\n(4) D''')
              for start in range(8,expected+1,8):
                  end=min(start+7,expected); lines=[]
                  for n in range(start,end+1):
                      lines.append('154 During inspiration' if n==154 else f'{n}. Which is question {n}?')
                      lines += ['(1) Option one','(2) Option two','(3) Option three','(4) Option four']
                      if n==20: lines += ['(1) 3','2 D']
                  lines.append(f'VERSION-01 I-PUC NEET Page {(start//8)+1} of 16'); pages.append('\n'.join(lines))
              rs=app.records(pages); nums=[q['num'] for q in rs]
              assert nums==list(range(1,expected+1)), (nums[:30],nums[-20:])
              assert rs[153]['num']==154 and rs[153]['stem']=='During inspiration', rs[153]
              assert all(q['stem'] for q in rs)
              print('PASS',expected)
          check(180); check(75)
          PY
      - name: Commit Phase 1 parser repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Fix phase 1 question extraction'
          git push
