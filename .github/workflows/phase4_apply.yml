name: Phase 4 Apply
on:
  push:
    paths:
      - 'tools/phase4_apply.py'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/phase4_apply.py
      - name: Validate
        run: |
          python -m py_compile app.py
          grep -q 'def translation_qa' app.py
          grep -q 'api.mymemory.translated.net' app.py
          grep -q 'Hindi translation unavailable' app.py
      - name: Commit app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Implement Phase 4 translation quality and QA'
          git push
