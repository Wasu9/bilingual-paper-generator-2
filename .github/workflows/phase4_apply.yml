name: Phase 4 Apply
on:
  push:
    paths:
      - '.github/workflows/phase4_apply.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phase 4
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('@st.cache_data(show_spinner=False)\ndef tr(x):')
          end=s.index('\ndef _add_typed_run', start)
          new=r'''@st.cache_data(show_spinner=False)
def _translate_google(text):
    last=None
    for _ in range(2):
        try:
            y=GoogleTranslator(source='en',target='hi').translate(text)
            if y and y.strip(): return y.strip()
        except Exception as e: last=e
    return ''

def _translate_mymemory(text):
    try:
        r=requests.get('https://api.mymemory.translated.net/get',params={'q':text,'langpair':'en|hi'},timeout=20)
        r.raise_for_status(); j=r.json(); y=(j.get('responseData') or {}).get('translatedText','')
        if y and y.strip() and y.strip().lower()!=text.strip().lower(): return y.strip()
    except Exception:
        pass
    return ''

def _restore_tokens(y,tokens):
    for i,v in enumerate(tokens):
        exact=f'PCX{i}X'
        patterns=[exact, f'[{exact}]', f'{{{exact}}}', f'<{exact}>', f'PCX {i} X', f'PCX{i} X', f'PCX {i}X']
        found=None
        for pat in patterns:
            if pat in y:
                found=pat;break
        if found is None: return None
        y=y.replace(found,v)
    return y

def _has_devanagari(text):
    return bool(re.search(r'[\u0900-\u097F]',text or ''))

def _is_formula_only(text):
    if not text:return True
    protected=PROTECT.sub('',text)
    return not re.search(r'[A-Za-z]{3,}',protected)

def _translate_protected(text):
    tokens=[]
    def protect(m):
        tokens.append(m.group(0)); return f'PCX{len(tokens)-1}X'
    masked=PROTECT.sub(protect,text)
    if not masked.strip(): return text,True,False
    for method in (_translate_google,_translate_mymemory):
        y=method(masked)
        if not y: continue
        restored=_restore_tokens(y,tokens)
        if restored is None: continue
        if _is_formula_only(text): return restored,True,False
        if restored.strip()==text.strip() and len(re.findall(r'\b[A-Za-z]{2,}\b',text))>=4:
            continue
        return restored,True,False
    return '[Hindi translation unavailable]',False,True

@st.cache_data(show_spinner=False)
def tr(x):
    if not x:return x
    y,ok,_=_translate_protected(x)
    return y

def _digits(text): return sorted(re.findall(r'\d+(?:\.\d+)?',text or ''))

def _symbol_counts(text):
    return {c:(text or '').count(c) for c in ('%','?','=','≤','≥','≠','→','←','±','∝')}

def _translation_issue(original,translated,label):
    if not original:return None
    if translated=='[Hindi translation unavailable]': return f'{label}: Hindi translation unavailable.'
    if not _is_formula_only(original) and translated.strip()==original.strip() and len(re.findall(r'\b[A-Za-z]{2,}\b',original))>=4:
        return f'{label}: English text appears unchanged.'
    if _digits(original)!=_digits(translated):
        return f'{label}: numerical value(s) changed or were lost.'
    a,b=_symbol_counts(original),_symbol_counts(translated)
    for k in a:
        if a[k]!=b[k]: return f'{label}: symbol/punctuation {k!r} changed.'
    return None

def translation_qa(rs):
    issues=[]
    for q in rs:
        for label,text in [(f'Q{q["num"]}',q['stem'])]+[(f'Q{q["num"]} option {k}',o) for k,o in enumerate(q['options'],1) if o]:
            issue=_translation_issue(text,tr(text),label)
            if issue: issues.append(issue)
    return issues
'''
          s=s[:start]+new+s[end:]
          old="""        if st.button('🚀 Generate Bilingual Word File',use_container_width=True):\n            out,miss=docx(rs,st.progress(0),assets,subjects);st.session_state['docx']=out;st.session_state['missing_visuals']=miss\n"""
          newui="""        if st.button('🚀 Generate Bilingual Word File',use_container_width=True):\n            with st.spinner('Translating and checking Hindi quality…'):\n                tq=translation_qa(rs)\n                out,miss=docx(rs,st.progress(0),assets,subjects)\n            st.session_state['docx']=out;st.session_state['missing_visuals']=miss;st.session_state['translation_issues']=tq\n"""
          if old not in s: raise SystemExit('generate block not found')
          s=s.replace(old,newui,1)
          old2="""        if 'docx' in st.session_state:\n            if st.session_state.get('missing_visuals'):st.warning('Unreliably readable image-based options were left as explicit placeholders instead of being hallucinated: '+', '.join(map(str,st.session_state['missing_visuals'])))\n            st.download_button('📥 Download Word Document',st.session_state['docx'],'Bilingual_Question_Paper.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document',use_container_width=True)\n"""
          newui2="""        if 'docx' in st.session_state:\n            if st.session_state.get('translation_issues'):\n                st.warning('Translation QA found issues; affected Hindi cells are explicitly marked instead of silently copying English:')\n                for issue in st.session_state['translation_issues'][:30]: st.write('• '+issue)\n            else:\n                st.success('Hindi translation QA passed: protected notation, numbers and key symbols were preserved.')\n            if st.session_state.get('missing_visuals'):st.warning('Unreliably readable image-based options were left as explicit placeholders instead of being hallucinated: '+', '.join(map(str,st.session_state['missing_visuals'])))\n            st.download_button('📥 Download Word Document',st.session_state['docx'],'Bilingual_Question_Paper.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document',use_container_width=True)\n"""
          if old2 not in s: raise SystemExit('download block not found')
          s=s.replace(old2,newui2,1)
          p.write_text(s,encoding='utf-8')
          print('Phase 4 patch applied')
          PY
      - name: Validate
        run: |
          python -m py_compile app.py
          grep -q "def translation_qa" app.py
          grep -q "api.mymemory.translated.net" app.py
          grep -q "Hindi translation unavailable" app.py
          echo 'Phase 4 syntax and feature checks passed'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Implement Phase 4 translation quality and QA'
          git push
